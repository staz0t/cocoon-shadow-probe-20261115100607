name: cocoon-model
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, closed, labeled]
permissions: {}
jobs:
  record:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: record
        env:
          NUM: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.ref }}
          SENDER: ${{ github.event.sender.login }}
          LABEL: ${{ github.event.label.name }}
          STATE: ${{ github.event.pull_request.state }}
        run: printf 'PROBE_EVENT pr=%s action=%s head=%s base=%s sender=%s label=%s state=%s\n' "$NUM" "$ACTION" "$HEAD" "$BASE" "$SENDER" "$LABEL" "$STATE"
  dashboard:
    runs-on: ubuntu-latest
    permissions: {contents: read, checks: write, issues: write, pull-requests: write, actions: write}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: flutter-dashboard model
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MODEL_CONFIG: .github/model/config.json
        run: python3 .github/model/cocoon_model.py dashboard
  autosubmit:
    needs: dashboard
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: autosubmit-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions: {contents: write, checks: read, statuses: read, issues: write, pull-requests: write, actions: write}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: auto_submit model
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MODEL_CONFIG: .github/model/config.json
        run: python3 .github/model/cocoon_model.py autosubmit
