name: release-from-branches
on:
  push:
    branches: ['release-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: run release tool from the branch
        env:
          PUB_CREDENTIALS: ${{ secrets.CANARY }}
        run: bash tool/run.sh
